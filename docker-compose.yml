# MariaDB for Ghosts of Wikipedia (optional: Person 1 runs MariaDB 12.3 natively on port 3306).
# Start:  docker compose up -d --wait     mariadb:lts = 12.3.x: system versioning + VECTOR.
services:
  mariadb:
    image: mariadb:lts
    container_name: ghosts-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: ghosts
      MARIADB_USER: ghosts
      MARIADB_PASSWORD: ghosts
      MARIADB_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-allowed-packet=64M
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

volumes:
  mariadb_data:
