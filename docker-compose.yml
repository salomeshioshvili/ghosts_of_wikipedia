services:
  mariadb:
    image: mariadb:lts
    container_name: ghosts-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: ghosts
      MARIADB_USER: ghosts
      MARIADB_PASSWORD: ghosts
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mariadb_data:
